appId: com.masarezenn.orca-discord-rpc
productName: Orca Discord Presence
copyright: MIT
directories:
  # Why not `release/`: on Windows a freshly written .asar can stay locked by the antivirus
  # scanner, which makes an incremental rebuild into the same directory fail with EBUSY.
  output: dist-installer
  buildResources: build
# Why explicit: only the bundle and the dependency it needs at runtime ship; the TypeScript
# sources, tests, and build scripts stay out of the installer.
files:
  - out/**
  - package.json
  - '!src/**'
  - '!config/**'
  - '!**/*.test.*'
extraResources:
  # Why: the tray icon lives outside the asar so process.resourcesPath resolves it at runtime.
  - from: assets/tray.png
    to: tray.png
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  # Why perMachine false: no admin prompt, which keeps the install one double-click.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Orca Discord Presence
  # Why false: keeping user config on uninstall means a reinstall keeps the application id.
  deleteAppDataOnUninstall: false
# Why: an unsigned build trips SmartScreen; signing needs a certificate and is out of scope.
forceCodeSigning: false
